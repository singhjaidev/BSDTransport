      <div style="display: flex; flex-direction: column; align-items: center; padding: 2rem;">
  <h1 style="text-align: center; margin-bottom: 2rem;">Pricing</h1>

  <div class="pricing-section" style="width: 100%; max-width: 500px;">
    <div class="vehicle-buttons" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
      <button class="vehicle-btn" data-type="Standard">Standard</button>
      <button class="vehicle-btn" data-type="Business">Business</button>

    </div>

    <div class="input-wrapper" style="margin-bottom: 1.5rem;">
      <input type="text" id="price-input" placeholder="Enter price (€)" disabled style="
        width: 100%;

        border: 1px solid #ccc;
        border-radius: 6px;
        background-color: #f0f0f0;
        font-size: 1rem;
      ">
    </div>

   <form method="POST" action="{{ url_for('admin_pricing') }}">
  <input type="hidden" id="vehicle-type" name="vehicle_type" value="">
  <input type="hidden" id="vehicle-price" name="vehicle_price" value="">

  <button id="update-btn" type="submit" disabled style="
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 6px;
    background-color: #ccc;
    color: #fff;
    font-size: 1rem;
    cursor: not-allowed;
    transition: background-color 0.3s ease;
  ">Update Prices</button>
</form>

<script>
  const vehicleButtons = document.querySelectorAll('.vehicle-btn');
  const input          = document.getElementById('price-input');
  const updateBtn      = document.getElementById('update-btn');

  let selectedType = null;

  // ─── Vehicle‐Selection Logic ───
  vehicleButtons.forEach(button => {
    button.addEventListener('click', () => {
      // Deselect all, then select this one
      vehicleButtons.forEach(btn => btn.classList.remove('selected'));
      button.classList.add('selected');

      // Save the type:
      selectedType = button.dataset.type;

      // Enable + reset the input field:
      input.disabled = false;
      input.style.backgroundColor = '#fff';
      input.value = '00.00';
      setCursor(0);

      // Disable the Update button until a valid number arrives:
      updateBtn.disabled = true;
      updateBtn.style.backgroundColor = '#ccc';
      updateBtn.style.cursor = 'not-allowed';

      console.log("Vehicle selected:", selectedType);
    });
  });


  // ─── Masked‐Input FOR DESKTOP (keydown) ───
  let rawDigits = ['0','0','0','0'];
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') return;
    e.preventDefault();

    const pos = input.selectionStart;
    if (e.key === 'Backspace') {
      const logicalPos = getLogicalPos(pos);
      if (logicalPos > 0) {
        rawDigits[logicalPos - 1] = '0';
        updateDisplay();
        setCursor(getVisualPos(logicalPos - 1));
      }
      return;
    }
    if (!/^[0-9]$/.test(e.key)) return;    // only digits
    const logicalPos = getLogicalPos(pos);
    if (logicalPos < 4) {
      rawDigits[logicalPos] = e.key;
      updateDisplay();
      setCursor(getVisualPos(logicalPos + 1));
    }
  });


  // ─── NEW: Standard ‘input’ listener for MOBILE ───
  input.addEventListener('input', () => {
    // Whatever the user typed (e.g. "12.34"), parse it:
    const val = parseFloat(input.value.trim());
    if (!isNaN(val) && val > 0) {
      updateBtn.disabled = false;
      updateBtn.style.backgroundColor = '#000';
      updateBtn.style.cursor = 'pointer';
    } else {
      updateBtn.disabled = true;
      updateBtn.style.backgroundColor = '#ccc';
      updateBtn.style.cursor = 'not-allowed';
    }
  });


  // ─── Re-draw the masked value and enable/disable “Update” ───
  function updateDisplay() {
    input.value = rawDigits[0] + rawDigits[1] + '.' + rawDigits[2] + rawDigits[3];
    const num = parseFloat(input.value);
    if (num > 0) {
      updateBtn.disabled = false;
      updateBtn.style.backgroundColor = '#000';
      updateBtn.style.cursor = 'pointer';
    } else {
      updateBtn.disabled = true;
      updateBtn.style.backgroundColor = '#ccc';
      updateBtn.style.cursor = 'not-allowed';
    }
  }

  // ─── Before actually submitting, fill the hidden fields ───
  const form      = document.querySelector('form');
  const typeInput = document.getElementById('vehicle-type');
  const priceInput = document.getElementById('vehicle-price');

  form.addEventListener('submit', (e) => {
    if (!selectedType) {
      alert("❌ Please select a vehicle type before updating price.");
      e.preventDefault();
      return;
    }
    typeInput.value  = selectedType;
    priceInput.value = input.value;
    console.log("Form ready—type:", typeInput.value, "price:", priceInput.value);
  });

  // ─── Cursor Helpers (unchanged) ───
  function getLogicalPos(visPos) { return visPos <= 1 ? visPos : visPos - 1; }
  function getVisualPos(logPos)  { return logPos <= 1 ? logPos : logPos + 1; }
  function setCursor(pos) {
    requestAnimationFrame(() => {
      input.setSelectionRange(pos, pos);
    });
  }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Bookings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .close-button {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 22px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
        }
        .close-button:hover {
            background-color: #e60000;
        }
        body {
            padding: 30px;
            background-color: #f8f8f8;
        }
    </style>
</head>
<body>

    <!-- Close button -->
    <a href="{{ url_for('admin_dashboard') }}">
        <button class="close-button" title="Close"><i class="fas fa-times"></i></button>
    </a>

    <!-- Bookings Table Only -->
    <div class="card" style="margin-top: 60px;">
        <div class="card-header">
            <h2>All Bookings</h2>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="data-table bookings-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Driver</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for b in bookings %}
                        <tr>
                            <td><span class="id-link">{{ b[1] }}</span></td>
                            <td>
                                <div class="user-info">
                                    <img src="{{ url_for('static', filename='images/user-avatar-small.jpg') }}" alt="User">
                                    <span>{{ b[2] }}</span>
                                </div>
                            </td>
                            <td>
                                <div class="user-info">
                                    <img src="{{ url_for('static', filename='images/driver-avatar-small.jpg') }}" alt="Driver">
                                    <span>{{ b[3] }}</span>
                                </div>
                            </td>
                            <td>{{ b[4] }}</td>
                            <td>{{ b[5] }}</td>
                            <td>{{ b[6] }}</td>
                            <td>${{ "%.2f"|format(b[8]) }}</td>
                            <td><span class="status {{ b[7]|lower|replace(' ', '-') }}">{{ b[7] }}</span></td>
                            <td>
                                <div class="actions">
                                    <button class="action-btn" aria-label="View Details"><i class="fas fa-eye"></i></button>
                                    <button class="action-btn" aria-label="Edit Booking"><i class="fas fa-edit"></i></button>
                                    <button class="action-btn" aria-label="Delete Booking"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
